<svg viewBox="0 0 1000 470" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f18"/><stop offset="48%" stop-color="#1a1840"/><stop offset="100%" stop-color="#10243a"/>
    </linearGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#ffffff" opacity="0.05"/></pattern>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 10 5 0 10z" fill="#9db4ff"/></marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 10 5 0 10z" fill="#f08a8a"/></marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 10 5 0 10z" fill="#8fd68a"/></marker>
  </defs>
  <rect width="1000" height="470" rx="22" fill="url(#bg)"/><rect width="1000" height="470" rx="22" fill="url(#dots)"/>
  <text x="500" y="36" text-anchor="middle" font-size="11" letter-spacing="3" font-weight="700" fill="#9db4ff">THE QUALITY GATE</text>
  <text x="500" y="68" text-anchor="middle" font-size="24" font-weight="600" fill="#f3f6fa">A model ships only after a repeatable check says it is good enough</text>
  <text x="500" y="90" text-anchor="middle" font-size="12" fill="#9fb3c8">The gate is code. A good adapter must pass it, and a deliberately bad adapter must be rejected by it</text>
<rect x="30" y="120" width="235" height="42" rx="10" fill="#ffffff" fill-opacity="0.06" stroke="#9db4ff" stroke-opacity="0.45"/>
<text x="42" y="146" text-anchor="start" font-size="11" fill="#f3f6fa">Answers always parse into the schema</text>
<rect x="275" y="120" width="235" height="42" rx="10" fill="#ffffff" fill-opacity="0.06" stroke="#9db4ff" stroke-opacity="0.45"/>
<text x="287" y="146" text-anchor="start" font-size="11" fill="#f3f6fa">Zero invalid codes, by construction</text>
<rect x="30" y="172" width="235" height="42" rx="10" fill="#ffffff" fill-opacity="0.06" stroke="#9db4ff" stroke-opacity="0.45"/>
<text x="42" y="198" text-anchor="start" font-size="11" fill="#f3f6fa">Leakage tests are green</text>
<rect x="275" y="172" width="235" height="42" rx="10" fill="#ffffff" fill-opacity="0.06" stroke="#9db4ff" stroke-opacity="0.45"/>
<text x="287" y="198" text-anchor="start" font-size="11" fill="#f3f6fa">No slice regresses (language, rare codes)</text>
<rect x="30" y="224" width="235" height="42" rx="10" fill="#ffffff" fill-opacity="0.06" stroke="#9db4ff" stroke-opacity="0.45"/>
<text x="42" y="250" text-anchor="start" font-size="11" fill="#f3f6fa">Accuracy and kg CO2e thresholds met</text>
<rect x="275" y="224" width="235" height="42" rx="10" fill="#ffffff" fill-opacity="0.06" stroke="#9db4ff" stroke-opacity="0.45"/>
<text x="287" y="250" text-anchor="start" font-size="11" fill="#f3f6fa">Confidence is calibrated (ECE)</text>
<rect x="30" y="276" width="235" height="42" rx="10" fill="#ffffff" fill-opacity="0.06" stroke="#9db4ff" stroke-opacity="0.45"/>
<text x="42" y="302" text-anchor="start" font-size="11" fill="#f3f6fa">Abstention improves accuracy</text>
<rect x="275" y="276" width="235" height="42" rx="10" fill="#ffffff" fill-opacity="0.06" stroke="#9db4ff" stroke-opacity="0.45"/>
<text x="287" y="302" text-anchor="start" font-size="11" fill="#f3f6fa">Licences and data sources recorded</text>
<text x="30" y="112" text-anchor="start" font-size="9.5" letter-spacing="1.5" fill="#9db4ff" font-weight="600">EIGHT OF THE CHECKS</text>
<path d="M520,246 L560,246 M520,246 L520,246" stroke="#9db4ff" stroke-opacity="0.8" stroke-width="1.6" fill="none"/>
<line x1="512" y1="246" x2="568" y2="246" stroke="#9db4ff" stroke-opacity="0.85" stroke-width="1.6" marker-end="url(#arr)"/>
<rect x="570" y="190" width="170" height="112" rx="12" fill="#ffffff" fill-opacity="0.06" stroke="#f0c05e" stroke-opacity="0.55"/>
<text x="584" y="216" font-size="13.5" font-weight="600" fill="#f3f6fa">The gate</text>
<text x="584" y="238" font-size="10.5" fill="#9fb3c8">Every candidate adapter</text>
<text x="584" y="253" font-size="10.5" fill="#9fb3c8">runs through the same</text>
<text x="584" y="268" font-size="10.5" fill="#9fb3c8">checks and gets a logged</text>
<text x="584" y="283" font-size="10.5" fill="#9fb3c8">verdict.</text>
<line x1="740" y1="218" x2="800" y2="168" stroke="#8fd68a" stroke-opacity="0.85" stroke-width="1.6" marker-end="url(#arrG)"/>
<line x1="740" y1="274" x2="800" y2="324" stroke="#f08a8a" stroke-opacity="0.85" stroke-width="1.6" marker-end="url(#arrR)"/>
<rect x="800" y="130" width="170" height="76" rx="12" fill="#8fd68a" fill-opacity="0.09" stroke="#8fd68a" stroke-opacity="0.6"/>
<text x="885" y="160" text-anchor="middle" font-size="13" fill="#f3f6fa" font-weight="600">Good adapter</text>
<text x="885" y="178" text-anchor="middle" font-size="12.5" fill="#8fd68a" font-weight="600">ACCEPTED</text>
<text x="885" y="194" text-anchor="middle" font-size="10" fill="#9fb3c8">verdict is logged</text>
<rect x="800" y="286" width="170" height="76" rx="12" fill="#f08a8a" fill-opacity="0.09" stroke="#f08a8a" stroke-opacity="0.6"/>
<text x="885" y="314" text-anchor="middle" font-size="11.5" fill="#f3f6fa" font-weight="600">Deliberately bad adapter</text>
<text x="885" y="332" text-anchor="middle" font-size="12.5" fill="#f08a8a" font-weight="600">REJECTED</text>
<text x="885" y="348" text-anchor="middle" font-size="10" fill="#9fb3c8">one step, or shuffled labels</text>
<rect x="30" y="392" width="460" height="54" rx="10" fill="#ffffff" fill-opacity="0.04" stroke="#f08a8a" stroke-opacity="0.5"/>
<text x="260.0" y="414" text-anchor="middle" font-size="11.5" fill="#f3f6fa">A gate that accepts the bad adapter</text>
<text x="260.0" y="430" text-anchor="middle" font-size="11.5" fill="#f3f6fa">is itself a failed deliverable</text>
<rect x="510" y="392" width="460" height="54" rx="10" fill="#ffffff" fill-opacity="0.04" stroke="#6fd8c7" stroke-opacity="0.5"/>
<text x="740.0" y="414" text-anchor="middle" font-size="11.5" fill="#f3f6fa">Spend rails: prepaid GPU balance capped at 50 euros, a runtime limit per job,</text>
<text x="740.0" y="430" text-anchor="middle" font-size="11.5" fill="#f3f6fa">a watchdog that destroys the instance, and a cost ledger</text>
</svg>
