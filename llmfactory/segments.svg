<svg viewBox="0 0 1000 380" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f18"/><stop offset="48%" stop-color="#1a1840"/><stop offset="100%" stop-color="#10243a"/>
    </linearGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#ffffff" opacity="0.05"/></pattern>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 10 5 0 10z" fill="#9db4ff"/></marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 10 5 0 10z" fill="#f08a8a"/></marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 10 5 0 10z" fill="#8fd68a"/></marker>
  </defs>
  <rect width="1000" height="380" rx="22" fill="url(#bg)"/><rect width="1000" height="380" rx="22" fill="url(#dots)"/>
  <text x="500" y="36" text-anchor="middle" font-size="11" letter-spacing="3" font-weight="700" fill="#9db4ff">THE BUSINESS HYPOTHESIS</text>
  <text x="500" y="68" text-anchor="middle" font-size="24" font-weight="600" fill="#f3f6fa">One pattern, many sectors</text>
  <text x="500" y="90" text-anchor="middle" font-size="12" fill="#9fb3c8">Messy text mapped onto a reference list, with confidence and audit. To be validated with customer interviews</text>
<rect x="250" y="112" width="500" height="64" rx="14" fill="#9db4ff" fill-opacity="0.10" stroke="#9db4ff" stroke-opacity="0.65"/>
<text x="500" y="140" text-anchor="middle" font-size="14" fill="#f3f6fa" font-weight="600">Messy text  to  a reference taxonomy or factor list</text>
<text x="500" y="160" text-anchor="middle" font-size="11" fill="#9fb3c8">with calibrated confidence, abstention and a consistency audit</text>
<rect x="30" y="220" width="224" height="96" rx="12" fill="#ffffff" fill-opacity="0.06" stroke="#6fd8c7" stroke-opacity="0.55"/>
<text x="44" y="246" font-size="13.5" font-weight="600" fill="#f3f6fa">Retail</text>
<text x="44" y="268" font-size="10.5" fill="#9fb3c8">Product catalogues mapped to</text>
<text x="44" y="283" font-size="10.5" fill="#9fb3c8">footprint entries and harmonised</text>
<text x="44" y="298" font-size="10.5" fill="#9fb3c8">categories.</text>
<line x1="142" y1="176" x2="142" y2="218" stroke="#9db4ff" stroke-opacity="0.85" stroke-width="1.6" marker-end="url(#arr)"/>
<rect x="268" y="220" width="224" height="96" rx="12" fill="#ffffff" fill-opacity="0.06" stroke="#6fd8c7" stroke-opacity="0.55"/>
<text x="282" y="246" font-size="13.5" font-weight="600" fill="#f3f6fa">Industry</text>
<text x="282" y="268" font-size="10.5" fill="#9fb3c8">Purchasing lines mapped to</text>
<text x="282" y="283" font-size="10.5" fill="#9fb3c8">material and process factors.</text>
<line x1="380" y1="176" x2="380" y2="218" stroke="#9db4ff" stroke-opacity="0.85" stroke-width="1.6" marker-end="url(#arr)"/>
<rect x="506" y="220" width="224" height="96" rx="12" fill="#ffffff" fill-opacity="0.06" stroke="#6fd8c7" stroke-opacity="0.55"/>
<text x="520" y="246" font-size="13.5" font-weight="600" fill="#f3f6fa">IT</text>
<text x="520" y="268" font-size="10.5" fill="#9fb3c8">Support tickets and incidents</text>
<text x="520" y="283" font-size="10.5" fill="#9fb3c8">triaged and routed to the right</text>
<text x="520" y="298" font-size="10.5" fill="#9fb3c8">team.</text>
<line x1="618" y1="176" x2="618" y2="218" stroke="#9db4ff" stroke-opacity="0.85" stroke-width="1.6" marker-end="url(#arr)"/>
<rect x="744" y="220" width="224" height="96" rx="12" fill="#ffffff" fill-opacity="0.06" stroke="#6fd8c7" stroke-opacity="0.55"/>
<text x="758" y="246" font-size="13.5" font-weight="600" fill="#f3f6fa">Sustainability</text>
<text x="758" y="268" font-size="10.5" fill="#9fb3c8">Spend and invoice lines mapped to</text>
<text x="758" y="283" font-size="10.5" fill="#9fb3c8">emission factors.</text>
<line x1="856" y1="176" x2="856" y2="218" stroke="#9db4ff" stroke-opacity="0.85" stroke-width="1.6" marker-end="url(#arr)"/>
<text x="500" y="348" text-anchor="middle" font-size="11" fill="#9fb3c8">Public-sector clients (for example procurement classification) follow the same pattern. No customer has been interviewed yet</text>
</svg>
