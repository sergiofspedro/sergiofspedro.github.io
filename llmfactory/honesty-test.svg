<svg viewBox="0 0 1000 420" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f18"/><stop offset="48%" stop-color="#1a1840"/><stop offset="100%" stop-color="#10243a"/>
    </linearGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#ffffff" opacity="0.05"/></pattern>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 10 5 0 10z" fill="#9db4ff"/></marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 10 5 0 10z" fill="#f08a8a"/></marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 10 5 0 10z" fill="#8fd68a"/></marker>
  </defs>
  <rect width="1000" height="420" rx="22" fill="url(#bg)"/><rect width="1000" height="420" rx="22" fill="url(#dots)"/>
  <text x="500" y="36" text-anchor="middle" font-size="11" letter-spacing="3" font-weight="700" fill="#9db4ff">HONESTY FIRST</text>
  <text x="500" y="68" text-anchor="middle" font-size="24" font-weight="600" fill="#f3f6fa">Before any GPU spend, a simple model gets the first try</text>
  <text x="500" y="90" text-anchor="middle" font-size="12" fill="#9fb3c8">If a cheap classifier is good enough, the project says so. That is a valid result, not a failure</text>
<rect x="30" y="125" width="270" height="110" rx="12" fill="#ffffff" fill-opacity="0.06" stroke="#6fd8c7" stroke-opacity="0.55"/>
<text x="44" y="151" font-size="13.5" font-weight="600" fill="#f3f6fa">Simple baselines</text>
<text x="44" y="173" font-size="10.5" fill="#9fb3c8">TF-IDF with logistic regression, and a</text>
<text x="44" y="188" font-size="10.5" fill="#9fb3c8">small multilingual encoder. Both run on a</text>
<text x="44" y="203" font-size="10.5" fill="#9fb3c8">CPU server, at no cost.</text>
<rect x="365" y="125" width="270" height="110" rx="12" fill="#ffffff" fill-opacity="0.06" stroke="#f0c05e" stroke-opacity="0.55"/>
<text x="379" y="151" font-size="13.5" font-weight="600" fill="#f3f6fa">The honesty test</text>
<text x="379" y="173" font-size="10.5" fill="#9fb3c8">Does the fine-tuned LLM beat the best</text>
<text x="379" y="188" font-size="10.5" fill="#9fb3c8">simple baseline by a margin agreed and</text>
<text x="379" y="203" font-size="10.5" fill="#9fb3c8">frozen in advance?</text>
<rect x="700" y="125" width="270" height="110" rx="12" fill="#ffffff" fill-opacity="0.06" stroke="#9db4ff" stroke-opacity="0.55"/>
<text x="714" y="151" font-size="13.5" font-weight="600" fill="#f3f6fa">Same test set for everyone</text>
<text x="714" y="173" font-size="10.5" fill="#9fb3c8">All models are compared in one table, with</text>
<text x="714" y="188" font-size="10.5" fill="#9fb3c8">the same metrics and the same language and</text>
<text x="714" y="203" font-size="10.5" fill="#9fb3c8">rarity slices.</text>
<line x1="300" y1="180" x2="363" y2="180" stroke="#9db4ff" stroke-opacity="0.85" stroke-width="1.6" marker-end="url(#arr)"/>
<line x1="635" y1="180" x2="698" y2="180" stroke="#9db4ff" stroke-opacity="0.85" stroke-width="1.6" marker-end="url(#arr)"/>
<line x1="500" y1="235" x2="500" y2="262" stroke="#9db4ff" stroke-opacity="0.85" stroke-width="1.6" marker-end="url(#arr)"/>
<path d="M500,262 L250,262 L250,285" fill="none" stroke="#8fd68a" stroke-opacity="0.85" stroke-width="1.6" marker-end="url(#arrG)"/>
<path d="M500,262 L750,262 L750,285" fill="none" stroke="#f08a8a" stroke-opacity="0.85" stroke-width="1.6" marker-end="url(#arrR)"/>
<text x="240" y="256" text-anchor="end" font-size="11" fill="#8fd68a" font-weight="600">yes</text>
<text x="760" y="256" text-anchor="start" font-size="11" fill="#f08a8a" font-weight="600">no</text>
<rect x="30" y="287" width="440" height="70" rx="12" fill="#ffffff" fill-opacity="0.06" stroke="#8fd68a" stroke-opacity="0.55"/>
<text x="44" y="313" font-size="13.5" font-weight="600" fill="#f3f6fa">Train the LLM (QLoRA)</text>
<text x="44" y="335" font-size="10.5" fill="#9fb3c8">Fine-tune on a rented 24 GB GPU inside a hard budget, after a</text>
<text x="44" y="350" font-size="10.5" fill="#9fb3c8">short pilot that extrapolates the cost.</text>
<rect x="530" y="287" width="440" height="70" rx="12" fill="#ffffff" fill-opacity="0.06" stroke="#f08a8a" stroke-opacity="0.55"/>
<text x="544" y="313" font-size="13.5" font-weight="600" fill="#f3f6fa">Report the null result</text>
<text x="544" y="335" font-size="10.5" fill="#9fb3c8">A simple classifier suffices. The value then moves to the</text>
<text x="544" y="350" font-size="10.5" fill="#9fb3c8">pipeline, the audit and the reusable factory.</text>
<rect x="30" y="372" width="940" height="36" rx="10" fill="#ffffff" fill-opacity="0.04" stroke="#9db4ff" stroke-opacity="0.5"/>
<text x="500.0" y="394" text-anchor="middle" font-size="11.5" fill="#f3f6fa">Same rule for every claim: the thresholds are frozen before the test set is touched, and the test set is used once</text>
</svg>
