<svg viewBox="0 0 1000 490" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f18"/><stop offset="48%" stop-color="#1a1840"/><stop offset="100%" stop-color="#10243a"/>
    </linearGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#ffffff" opacity="0.05"/></pattern>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 10 5 0 10z" fill="#9db4ff"/></marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 10 5 0 10z" fill="#f08a8a"/></marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 10 5 0 10z" fill="#8fd68a"/></marker>
  </defs>
  <rect width="1000" height="490" rx="22" fill="url(#bg)"/><rect width="1000" height="490" rx="22" fill="url(#dots)"/>
  <text x="500" y="36" text-anchor="middle" font-size="11" letter-spacing="3" font-weight="700" fill="#9db4ff">THE FIRST CASE</text>
  <text x="500" y="68" text-anchor="middle" font-size="24" font-weight="600" fill="#f3f6fa">From an ingredient list to a carbon-footprint entry</text>
  <text x="500" y="90" text-anchor="middle" font-size="12" fill="#9fb3c8">Open Food Facts text in, an Agribalyse food entry out, with a calibrated confidence and the right to say "not sure"</text>
<rect x="30" y="125" width="290" height="100" rx="12" fill="#ffffff" fill-opacity="0.06" stroke="#9db4ff" stroke-opacity="0.55"/>
<text x="44" y="151" font-size="13.5" font-weight="600" fill="#f3f6fa">1  Ingredient text</text>
<text x="44" y="173" font-size="10.5" fill="#9fb3c8">Open Food Facts product labels in French,</text>
<text x="44" y="188" font-size="10.5" fill="#9fb3c8">English, German, Spanish, Italian, Portuguese</text>
<text x="44" y="203" font-size="10.5" fill="#9fb3c8">and Dutch.</text>
<rect x="355" y="125" width="290" height="100" rx="12" fill="#ffffff" fill-opacity="0.06" stroke="#9db4ff" stroke-opacity="0.55"/>
<text x="369" y="151" font-size="13.5" font-weight="600" fill="#f3f6fa">2  Clean and split</text>
<text x="369" y="173" font-size="10.5" fill="#9fb3c8">Filters, then a split that keeps near-duplicate</text>
<text x="369" y="188" font-size="10.5" fill="#9fb3c8">products together, so the test is never</text>
<text x="369" y="203" font-size="10.5" fill="#9fb3c8">contaminated.</text>
<rect x="680" y="125" width="290" height="100" rx="12" fill="#ffffff" fill-opacity="0.06" stroke="#9db4ff" stroke-opacity="0.55"/>
<text x="694" y="151" font-size="13.5" font-weight="600" fill="#f3f6fa">3  Shortlist</text>
<text x="694" y="173" font-size="10.5" fill="#9fb3c8">A search step proposes the 20 most likely</text>
<text x="694" y="188" font-size="10.5" fill="#9fb3c8">Agribalyse food entries for each product.</text>
<line x1="320" y1="175" x2="353" y2="175" stroke="#9db4ff" stroke-opacity="0.85" stroke-width="1.6" marker-end="url(#arr)"/>
<line x1="645" y1="175" x2="678" y2="175" stroke="#9db4ff" stroke-opacity="0.85" stroke-width="1.6" marker-end="url(#arr)"/>
<rect x="680" y="285" width="290" height="100" rx="12" fill="#ffffff" fill-opacity="0.06" stroke="#f0c05e" stroke-opacity="0.55"/>
<text x="694" y="311" font-size="13.5" font-weight="600" fill="#f3f6fa">4  LLM chooses</text>
<text x="694" y="333" font-size="10.5" fill="#9fb3c8">The fine-tuned small LLM reads the text and the</text>
<text x="694" y="348" font-size="10.5" fill="#9fb3c8">shortlist and answers with one candidate</text>
<text x="694" y="363" font-size="10.5" fill="#9fb3c8">number, or 0.</text>
<rect x="355" y="285" width="290" height="100" rx="12" fill="#ffffff" fill-opacity="0.06" stroke="#f0c05e" stroke-opacity="0.55"/>
<text x="369" y="311" font-size="13.5" font-weight="600" fill="#f3f6fa">5  Calibrate</text>
<text x="369" y="333" font-size="10.5" fill="#9fb3c8">Temperature scaling makes the confidence</text>
<text x="369" y="348" font-size="10.5" fill="#9fb3c8">honest: when it says 80%, it should be right</text>
<text x="369" y="363" font-size="10.5" fill="#9fb3c8">about 80% of the time.</text>
<rect x="30" y="285" width="290" height="100" rx="12" fill="#ffffff" fill-opacity="0.06" stroke="#8fd68a" stroke-opacity="0.55"/>
<text x="44" y="311" font-size="13.5" font-weight="600" fill="#f3f6fa">6  Answer or abstain</text>
<text x="44" y="333" font-size="10.5" fill="#9fb3c8">Below a confidence threshold the model abstains</text>
<text x="44" y="348" font-size="10.5" fill="#9fb3c8">instead of guessing. Every answer converts to</text>
<text x="44" y="363" font-size="10.5" fill="#9fb3c8">kg CO2e.</text>
<line x1="825" y1="225" x2="825" y2="285" stroke="#9db4ff" stroke-opacity="0.85" stroke-width="1.6" marker-end="url(#arr)"/>
<line x1="680" y1="335" x2="647" y2="335" stroke="#9db4ff" stroke-opacity="0.85" stroke-width="1.6" marker-end="url(#arr)"/>
<line x1="355" y1="335" x2="322" y2="335" stroke="#9db4ff" stroke-opacity="0.85" stroke-width="1.6" marker-end="url(#arr)"/>
<rect x="30" y="410" width="940" height="54" rx="10" fill="#ffffff" fill-opacity="0.04" stroke="#6fd8c7" stroke-opacity="0.5"/>
<text x="500.0" y="432" text-anchor="middle" font-size="11.5" fill="#f3f6fa">Audit as a by-product: where a confident prediction disagrees with the code already assigned,</text>
<text x="500.0" y="448" text-anchor="middle" font-size="11.5" fill="#f3f6fa">the product is flagged as a suspect and ranked by the kg CO2e difference. Suspects are not verified errors</text>
</svg>
