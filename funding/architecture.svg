<text x="880.0" y="189.0" text-anchor="middle" font-size="10" fill="#9fb3c8">every claim links to its source</text>
<rect x="790" y="230" width="180" height="62" rx="10" fill="#ffffff" fill-opacity="0.06" stroke="#f0c05e" stroke-opacity="0.45"/>
<text x="880.0" y="258.0" text-anchor="middle" font-size="12" font-weight="600" fill="#f3f6fa">Digests</text>
<text x="880.0" y="274.0" text-anchor="middle" font-size="10" fill="#9fb3c8">daily or weekly email and Slack</text>
