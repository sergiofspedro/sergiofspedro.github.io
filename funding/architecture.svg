<text x="880.0" y="343.0" text-anchor="middle" font-size="12" font-weight="600" fill="#f3f6fa">Chrome extension</text>
<text x="880.0" y="359.0" text-anchor="middle" font-size="10" fill="#9fb3c8">auto-apply fills the form</text>
