<text x="110.0" y="274.0" text-anchor="middle" font-size="10" fill="#9fb3c8">AI Act, GDPR, NIS2, national</text>
<line x1="190" y1="261" x2="255" y2="261" stroke="#f0c05e" stroke-opacity="0.7" stroke-width="1.6" marker-end="url(#arr)"/>
