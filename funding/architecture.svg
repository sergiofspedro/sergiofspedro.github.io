  <rect width="1000" height="440" rx="22" fill="url(#bg)"/><rect width="1000" height="440" rx="22" fill="url(#dots)"/>
  <text x="500" y="36" text-anchor="middle" font-size="11" letter-spacing="3" font-weight="700" fill="#f0c05e">SYSTEM ARCHITECTURE</text>
  <text x="500" y="68" text-anchor="middle" font-size="24" font-weight="600" fill="#f3f6fa">Funding AICopilot: from public feeds to cited answers</text>
  <text x="500" y="90" text-anchor="middle" font-size="12" fill="#9fb3c8">Every source is ingested on its own schedule, structured, synthesised and checked before it reaches the user</text>
<text x="110" y="125" text-anchor="middle" font-size="10" letter-spacing="2" font-weight="700" fill="#6fd8c7">SOURCES</text>
<text x="335" y="125" text-anchor="middle" font-size="10" letter-spacing="2" font-weight="700" fill="#6fd8c7">INGEST</text>
<text x="560" y="125" text-anchor="middle" font-size="10" letter-spacing="2" font-weight="700" fill="#6fd8c7">SYNTHESISE</text>
<text x="880" y="125" text-anchor="middle" font-size="10" letter-spacing="2" font-weight="700" fill="#6fd8c7">ACT</text>
