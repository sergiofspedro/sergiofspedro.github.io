<text x="335.0" y="173.0" text-anchor="middle" font-size="12" font-weight="600" fill="#f3f6fa">Structure</text>
<text x="335.0" y="189.0" text-anchor="middle" font-size="10" fill="#9fb3c8">deadline, budget, eligibility</text>
<rect x="255" y="230" width="160" height="62" rx="10" fill="#ffffff" fill-opacity="0.06" stroke="#f0c05e" stroke-opacity="0.45"/>
<text x="335.0" y="258.0" text-anchor="middle" font-size="12" font-weight="600" fill="#f3f6fa">Parse and index</text>
<text x="335.0" y="274.0" text-anchor="middle" font-size="10" fill="#9fb3c8">regulatory documents, PDF tables</text>
