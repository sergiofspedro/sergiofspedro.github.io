<svg viewBox="0 0 1000 470" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f18"/><stop offset="48%" stop-color="#0f2a1c"/><stop offset="100%" stop-color="#10243a"/>
    </linearGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#ffffff" opacity="0.05"/></pattern>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 10 5 0 10z" fill="#6fd8c7"/></marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 10 5 0 10z" fill="#f08a8a"/></marker>
  </defs>
  <rect width="1000" height="470" rx="22" fill="url(#bg)"/><rect width="1000" height="470" rx="22" fill="url(#dots)"/>
  <text x="500" y="36" text-anchor="middle" font-size="11" letter-spacing="3" font-weight="700" fill="#6fd8c7">GOVERNANCE</text>
  <text x="500" y="68" text-anchor="middle" font-size="24" font-weight="600" fill="#f3f6fa">Every candidate has a life cycle and every writer has limits</text>
  <text x="500" y="90" text-anchor="middle" font-size="12" fill="#9fb3c8">Three scripts and one autonomous wave touch the same document. The rules say who may write what</text>
<text x="30" y="124" text-anchor="start" font-size="10" letter-spacing="2" font-weight="700" fill="#6fd8c7">A CANDIDATE'S LIFE</text>
<rect x="30" y="140" width="170" height="40" rx="20" fill="#ffffff" fill-opacity="0.07" stroke="#f0c05e" stroke-opacity="0.6"/>
<text x="115.0" y="165" text-anchor="middle" font-size="12.5" font-weight="600" fill="#f3f6fa">pending_form</text>
<rect x="300" y="140" width="150" height="40" rx="20" fill="#ffffff" fill-opacity="0.07" stroke="#8fd68a" stroke-opacity="0.6"/>
<text x="375.0" y="165" text-anchor="middle" font-size="12.5" font-weight="600" fill="#f3f6fa">approved</text>
<rect x="550" y="140" width="170" height="40" rx="20" fill="#ffffff" fill-opacity="0.07" stroke="#6fd8c7" stroke-opacity="0.6"/>
<text x="635.0" y="165" text-anchor="middle" font-size="12.5" font-weight="600" fill="#f3f6fa">implemented</text>
<rect x="820" y="140" width="150" height="40" rx="20" fill="#ffffff" fill-opacity="0.07" stroke="#5ec8e0" stroke-opacity="0.6"/>
<text x="895.0" y="165" text-anchor="middle" font-size="12.5" font-weight="600" fill="#f3f6fa">archived</text>
<line x1="200" y1="160" x2="298" y2="160" stroke="#6fd8c7" stroke-opacity="0.8" stroke-width="1.6" marker-end="url(#arr)"/>
<line x1="450" y1="160" x2="548" y2="160" stroke="#6fd8c7" stroke-opacity="0.8" stroke-width="1.6" marker-end="url(#arr)"/>
<line x1="720" y1="160" x2="818" y2="160" stroke="#6fd8c7" stroke-opacity="0.8" stroke-width="1.6" marker-end="url(#arr)"/>
<text x="249" y="152" text-anchor="middle" font-size="10" fill="#9fb3c8">owner approves</text>
<text x="499" y="152" text-anchor="middle" font-size="10" fill="#9fb3c8">wave ships it</text>
<text x="769" y="152" text-anchor="middle" font-size="10" fill="#9fb3c8">closed</text>
<rect x="30" y="215" width="170" height="40" rx="20" fill="#ffffff" fill-opacity="0.07" stroke="#f08a8a" stroke-opacity="0.6"/>
<text x="115.0" y="240" text-anchor="middle" font-size="12.5" font-weight="600" fill="#f3f6fa">rejected</text>
<rect x="300" y="215" width="170" height="40" rx="20" fill="#ffffff" fill-opacity="0.07" stroke="#f0c05e" stroke-opacity="0.6"/>
<text x="385.0" y="240" text-anchor="middle" font-size="12.5" font-weight="600" fill="#f3f6fa">needs_context</text>
<line x1="115" y1="180" x2="115" y2="213" stroke="#f08a8a" stroke-opacity="0.8" stroke-width="1.6" marker-end="url(#arrR)"/>
<line x1="160" y1="180" x2="330" y2="213" stroke="#6fd8c7" stroke-opacity="0.8" stroke-width="1.6" marker-end="url(#arr)"/>
<text x="125" y="202" text-anchor="start" font-size="10" fill="#9fb3c8">owner rejects</text>
<text x="262" y="194" text-anchor="start" font-size="10" fill="#9fb3c8">owner asks for context</text>
<rect x="540" y="211" width="430" height="48" rx="10" fill="#ffffff" fill-opacity="0.04" stroke="#f0c05e" stroke-opacity="0.5"/>
<text x="755.0" y="233" text-anchor="middle" font-size="11.5" fill="#f3f6fa">A candidate can only leave pending_form through a human answer.</text>
<text x="755.0" y="249" text-anchor="middle" font-size="11.5" fill="#f3f6fa">There is no other door</text>
<text x="30" y="292" text-anchor="start" font-size="10" letter-spacing="2" font-weight="700" fill="#6fd8c7">WHO MAY WRITE WHAT</text>
<text x="42" y="316" text-anchor="start" font-size="9.5" letter-spacing="1.5" font-weight="700" fill="#f0c05e">PART OF THE DOCUMENT</text>
<text x="357" y="316" text-anchor="start" font-size="9.5" letter-spacing="1.5" font-weight="700" fill="#f0c05e">MAY WRITE IT</text>
<text x="702" y="316" text-anchor="start" font-size="9.5" letter-spacing="1.5" font-weight="700" fill="#f0c05e">NEVER</text>
<rect x="30" y="326" width="300" height="34" rx="8" fill="#ffffff" fill-opacity="0.05" stroke="#6fd8c7" stroke-opacity="0.35"/>
<text x="42" y="347" text-anchor="start" font-size="10.5" fill="#f3f6fa">Proposal block (the defect and its evidence)</text>
<rect x="345" y="326" width="330" height="34" rx="8" fill="#ffffff" fill-opacity="0.05" stroke="#6fd8c7" stroke-opacity="0.35"/>
<text x="357" y="347" text-anchor="start" font-size="10.5" fill="#f3f6fa">The extractor</text>
<rect x="690" y="326" width="280" height="34" rx="8" fill="#ffffff" fill-opacity="0.05" stroke="#6fd8c7" stroke-opacity="0.35"/>
<text x="702" y="347" text-anchor="start" font-size="10.5" fill="#f3f6fa">The reply consumer, the improvement waves</text>
<rect x="30" y="368" width="300" height="34" rx="8" fill="#ffffff" fill-opacity="0.05" stroke="#6fd8c7" stroke-opacity="0.35"/>
<text x="42" y="389" text-anchor="start" font-size="10.5" fill="#f3f6fa">Status and the owner's answer</text>
<rect x="345" y="368" width="330" height="34" rx="8" fill="#ffffff" fill-opacity="0.05" stroke="#6fd8c7" stroke-opacity="0.35"/>
<text x="357" y="389" text-anchor="start" font-size="10.5" fill="#f3f6fa">The reply consumer and the improvement wave</text>
<rect x="690" y="368" width="280" height="34" rx="8" fill="#ffffff" fill-opacity="0.05" stroke="#6fd8c7" stroke-opacity="0.35"/>
<text x="702" y="389" text-anchor="start" font-size="10.5" fill="#f3f6fa">The extractor</text>
<rect x="30" y="410" width="300" height="34" rx="8" fill="#ffffff" fill-opacity="0.05" stroke="#6fd8c7" stroke-opacity="0.35"/>
<text x="42" y="431" text-anchor="start" font-size="10.5" fill="#f3f6fa">Mission and closing report of a wave</text>
<rect x="345" y="410" width="330" height="34" rx="8" fill="#ffffff" fill-opacity="0.05" stroke="#6fd8c7" stroke-opacity="0.35"/>
<text x="357" y="431" text-anchor="start" font-size="10.5" fill="#f3f6fa">The improvement wave itself</text>
<rect x="690" y="410" width="280" height="34" rx="8" fill="#ffffff" fill-opacity="0.05" stroke="#6fd8c7" stroke-opacity="0.35"/>
<text x="702" y="431" text-anchor="start" font-size="10.5" fill="#f3f6fa">The extractor, the reply consumer</text>
</svg>
